apiVersion: v1alpha1
kind: KubePrismConfig
port: 7445 # KubePrism port.
---
apiVersion: v1alpha1
kind: SysctlConfig
# Used to configure the machine's sysctls (kernel parameters under `/proc/sys`).
params:
    net.core.default_qdisc: fq
    net.ipv4.tcp_congestion_control: bbr
    net.ipv4.tcp_fin_timeout: "30"
    net.ipv4.tcp_tw_reuse: "1"
---
apiVersion: v1alpha1
kind: TimeSyncConfig
# Specifies NTP configuration to sync the time over network.
ntp:
    # Specifies time (NTP) servers to use for setting the system time.
    servers:
        - a.st1.ntp.br
        - c.st1.ntp.br
        - d.st1.ntp.br
        - e.st1.ntp.br
        - gps.nu.ntp.br
    useNTS: true # Enables NTS (Network Time Security) for NTP queries.
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn # Name of the volume.
# The provisioning describes how the volume is provisioned.
provisioning:
    # The disk selector expression.
    diskSelector:
        match: disk.dev_path == '/dev/vdb' # The Common Expression Language (CEL) expression to match the disk.
    grow: false # Should the volume grow to the size of the disk (if possible).
    minSize: 150GiB # The minimum size of the volume.
    
    # # The maximum size of the volume, if not specified the volume can grow to the size of the
    # maxSize: 50GiB
    # maxSize: 80%

