# Provide configuration for the kube-proxy.
config: {}
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: true # By default, CoreDNS deployment is enabled.
---
apiVersion: v1alpha1
kind: SysctlConfig
# Used to configure the machine's sysctls (kernel parameters under `/proc/sys`).
params:
    net.core.default_qdisc: fq
    net.ipv4.tcp_congestion_control: bbr
    net.ipv4.tcp_fin_timeout: "30"
    net.ipv4.tcp_tw_reuse: "1"
---
apiVersion: v1alpha1
kind: TimeSyncConfig
# Specifies NTP configuration to sync the time over network.
ntp:
    # Specifies time (NTP) servers to use for setting the system time.
    servers:
        - a.st1.ntp.br
        - c.st1.ntp.br
        - d.st1.ntp.br
        - e.st1.ntp.br
        - gps.nu.ntp.br
    useNTS: true # Enables NTS (Network Time Security) for NTP queries.
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 172.16.200.10 # IP address to be advertised as a Layer 2 VIP.
link: eth1 # Name of the link to assign the VIP to.
